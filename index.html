<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4ec0ca">
  <title>Flappy</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1d2b35;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
    }
    canvas {
      display: block;
      width: min(100vw, calc(100dvh * 2 / 3));
      height: auto;
      aspect-ratio: 2 / 3;
      touch-action: none;
      image-rendering: auto;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Logical resolution (scaled by CSS)
    const W = 400;
    const H = 600;
    canvas.width = W;
    canvas.height = H;

    // Tuning
    const GRAVITY = 1400;      // px / s^2
    const FLAP_VY = -420;      // px / s
    const MAX_FALL = 720;      // px / s
    const PIPE_W = 64;
    const PIPE_GAP = 156;
    const PIPE_SPEED = 150;    // px / s
    const PIPE_SPACING = 230;  // horizontal distance between pipes
    const GROUND_H = 90;
    const BIRD_X = 96;
    const BIRD_R = 15;
    const BEST_KEY = 'flappy-best-score';

    let state, bird, pipes, score, best, time, deathTime, groundOffset, clouds;
    let last = 0;

    try {
      best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0;
    } catch (e) {
      best = 0;
    }

    clouds = [
      { x: 60,  y: 90,  s: 1.0, v: 12 },
      { x: 260, y: 160, s: 0.7, v: 8 },
      { x: 360, y: 60,  s: 0.85, v: 10 },
    ];

    function reset() {
      bird = { y: H / 2, vy: 0, rot: 0 };
      pipes = [];
      score = 0;
      time = 0;
      deathTime = 0;
      groundOffset = 0;
      state = 'ready'; // 'ready' | 'playing' | 'over'
    }

    function randomGapY() {
      const min = PIPE_GAP / 2 + 50;
      const max = H - GROUND_H - PIPE_GAP / 2 - 50;
      return min + Math.random() * (max - min);
    }

    function spawnPipe(x) {
      pipes.push({ x, gapY: randomGapY(), passed: false });
    }

    function flap() {
      if (state === 'ready') {
        state = 'playing';
        bird.vy = FLAP_VY;
        spawnPipe(W + 40);
      } else if (state === 'playing') {
        bird.vy = FLAP_VY;
      } else if (state === 'over' && time - deathTime > 0.6) {
        reset();
      }
    }

    function die() {
      if (state !== 'playing') return;
      state = 'over';
      deathTime = time;
      if (score > best) {
        best = score;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      }
    }

    function hitsPipe(p) {
      const left = p.x;
      const right = p.x + PIPE_W;
      const gapTop = p.gapY - PIPE_GAP / 2;
      const gapBottom = p.gapY + PIPE_GAP / 2;

      // Circle vs rect check for top and bottom pipes
      const rects = [
        { x1: left, y1: 0, x2: right, y2: gapTop },
        { x1: left, y1: gapBottom, x2: right, y2: H - GROUND_H },
      ];
      for (const r of rects) {
        const cx = Math.max(r.x1, Math.min(BIRD_X, r.x2));
        const cy = Math.max(r.y1, Math.min(bird.y, r.y2));
        const dx = BIRD_X - cx;
        const dy = bird.y - cy;
        if (dx * dx + dy * dy < (BIRD_R - 2) * (BIRD_R - 2)) return true;
      }
      return false;
    }

    function update(dt) {
      time += dt;

      // Clouds drift always
      for (const c of clouds) {
        c.x -= c.v * dt;
        if (c.x < -60) c.x = W + 60;
      }

      if (state === 'ready') {
        bird.y = H / 2 + Math.sin(time * 4) * 8;
        bird.rot = 0;
        return;
      }

      if (state === 'playing') {
        groundOffset += PIPE_SPEED * dt;

        // Bird physics
        bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
        bird.y += bird.vy * dt;
        bird.rot = Math.max(-0.5, Math.min(bird.vy / 500, 1.3));

        // Pipes
        for (const p of pipes) p.x -= PIPE_SPEED * dt;

        const lastPipe = pipes[pipes.length - 1];
        if (lastPipe && lastPipe.x < W - PIPE_SPACING) {
          spawnPipe(lastPipe.x + PIPE_SPACING);
        }

        while (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();

        for (const p of pipes) {
          if (!p.passed && p.x + PIPE_W < BIRD_X - BIRD_R) {
            p.passed = true;
            score++;
          }
          if (hitsPipe(p)) {
            die();
            break;
          }
        }

        // Ceiling and ground
        if (bird.y - BIRD_R < 0) {
          bird.y = BIRD_R;
          bird.vy = 0;
        }
        if (bird.y + BIRD_R >= H - GROUND_H) {
          bird.y = H - GROUND_H - BIRD_R;
          die();
        }
        return;
      }

      if (state === 'over') {
        // Bird falls to the ground after dying
        bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
        bird.y += bird.vy * dt;
        bird.rot = Math.min(bird.rot + 6 * dt, Math.PI / 2);
        const floor = H - GROUND_H - BIRD_R;
        if (bird.y > floor) {
          bird.y = floor;
          bird.vy = 0;
        }
      }
    }

    // ---------- Drawing ----------

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#4ec0ca');
      g.addColorStop(1, '#a7e3ea');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Clouds
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (const c of clouds) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 26 * c.s, c.y - 10 * c.s, 28 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 56 * c.s, c.y, 22 * c.s, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPipe(x, y, h, flip) {
      // Body
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(x, y, PIPE_W, h);
      ctx.fillStyle = '#5a9a22';
      ctx.fillRect(x + PIPE_W - 8, y, 8, h);
      // Cap
      const capH = 26;
      const capY = flip ? y + h - capH : y;
      ctx.fillStyle = '#8fd540';
      ctx.fillRect(x - 4, capY, PIPE_W + 8, capH);
      ctx.strokeStyle = '#2f5d12';
      ctx.lineWidth = 3;
      ctx.strokeRect(x - 4, capY, PIPE_W + 8, capH);
      ctx.strokeRect(x, y, PIPE_W, h);
    }

    function drawPipes() {
      for (const p of pipes) {
        const gapTop = p.gapY - PIPE_GAP / 2;
        const gapBottom = p.gapY + PIPE_GAP / 2;
        drawPipe(p.x, 0, gapTop, true);
        drawPipe(p.x, gapBottom, H - GROUND_H - gapBottom, false);
      }
    }

    function drawGround() {
      const y = H - GROUND_H;
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, y, W, GROUND_H);

      // Stripes that scroll with the game
      ctx.fillStyle = '#d2c475';
      const stripe = 24;
      const off = groundOffset % stripe;
      for (let x = -off; x < W; x += stripe) {
        ctx.fillRect(x, y + 22, 12, GROUND_H - 22);
      }

      // Grass top
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(0, y, W, 16);
      ctx.fillStyle = '#5a9a22';
      for (let x = -off; x < W; x += stripe) {
        ctx.fillRect(x, y + 12, 12, 4);
      }
      ctx.strokeStyle = '#2f5d12';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    function drawBird() {
      ctx.save();
      ctx.translate(BIRD_X, bird.y);
      ctx.rotate(bird.rot);

      // Body
      ctx.fillStyle = '#f7d038';
      ctx.strokeStyle = '#3b2a10';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Wing (flaps faster while playing)
      const flapSpeed = state === 'playing' ? 22 : 8;
      const wingY = Math.sin(time * flapSpeed) * 4;
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath();
      ctx.ellipse(-4, 3 + wingY, 8, 5, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -5, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(8, -5, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f08a24';
      ctx.beginPath();
      ctx.moveTo(BIRD_R - 3, -3);
      ctx.lineTo(BIRD_R + 10, 1);
      ctx.lineTo(BIRD_R - 3, 5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function outlinedText(text, x, y, size) {
      ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(4, size / 8);
      ctx.strokeStyle = '#3b2a10';
      ctx.strokeText(text, x, y);
      ctx.fillStyle = '#fff';
      ctx.fillText(text, x, y);
    }

    function drawScore() {
      if (state === 'ready') return;
      outlinedText(String(score), W / 2, 90, 56);
    }

    function drawPanel(title, lines) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(0, 0, W, H);

      outlinedText(title, W / 2, H * 0.32, 52);
      let y = H * 0.32 + 70;
      for (const line of lines) {
        outlinedText(line, W / 2, y, 26);
        y += 40;
      }
    }

    function draw() {
      drawBackground();
      drawPipes();
      drawGround();
      drawBird();
      drawScore();

      if (state === 'ready') {
        drawPanel('Flappy', ['Tap to start', `Best: ${best}`]);
      } else if (state === 'over') {
        drawPanel('Game Over', [
          `Score: ${score}`,
          `Best: ${best}`,
          '',
          'Tap to retry',
        ]);
      }
    }

    // ---------- Loop ----------

    function frame(ts) {
      if (!last) last = ts;
      const dt = Math.min((ts - last) / 1000, 1 / 30);
      last = ts;

      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    // ---------- Input ----------

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      flap();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!e.repeat) flap();
      }
    });

    // Prevent pinch/double-tap zoom on iOS
    document.addEventListener('gesturestart', (e) => e.preventDefault());

    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
